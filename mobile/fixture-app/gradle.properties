# 移动隐私演示夹具 —— 仅用于授权测试（自有设备与自有 APK）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=D:/Anroid/temp
org.gradle.parallel=true
org.gradle.caching=true

# 本机 JDK 21（勿用 JBR/JDK25，Gradle 8.13 不支持 Java 25）。
# 旧开发机的 .tools/jdk21 在本机不存在，写死会让 Gradle 以 "Java home supplied is invalid" 失败。
org.gradle.java.home=D:/Anroid/JDK

android.useAndroidX=true
android.nonTransitiveRClass=true

# 工程路径含非 ASCII 字符（Windows 用户名 毛宇淇），AGP 默认拒绝。
android.overridePathCheck=true

kotlin.code.style=official

# dl.google.com 被阻断；这些超时让被阻断的主机快速失败而不是挂起数分钟。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=60000
