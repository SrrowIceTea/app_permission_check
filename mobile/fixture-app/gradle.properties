# 移动隐私演示夹具 —— 仅用于授权测试（自有设备与自有 APK）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 使用当前机器 JAVA_HOME 或 Gradle 的 JDK 选择；不提交作者机器绝对路径。
# 本项目 Java/Kotlin 目标为 17，Gradle 8.13 不支持 Java 25。

android.useAndroidX=true
android.nonTransitiveRClass=true

# 工程路径含非 ASCII 字符（Windows 用户名 毛宇淇），AGP 默认拒绝。
android.overridePathCheck=true

kotlin.code.style=official

# dl.google.com 被阻断；这些超时让被阻断的主机快速失败而不是挂起数分钟。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=60000
