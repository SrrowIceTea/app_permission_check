<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>V-Scanner · 移动应用数据安全审计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
</head>
<body>

<!-- 页底：比面板更黑，露出一块“被切下去”的底 -->
<div class="bg" aria-hidden="true"></div>

<!-- 不规则舞台面板（凹槽 + 右下切角） -->
<div class="stage-panel" aria-hidden="true">
  <div class="panel-image"></div>
  <div class="panel-veil"></div>
  <div class="panel-shine"></div>
  <div class="panel-rays"></div>
  <div class="panel-grain"></div>
  <span class="panel-line panel-top"></span>
  <span class="panel-line panel-left"></span>
  <span class="panel-line panel-right panel-right-a"></span>
  <span class="panel-line panel-right panel-right-c"></span>
  <span class="panel-line panel-right panel-right-b"></span>
  <span class="panel-line panel-bottom"></span>
</div>

<!-- 凹槽里的竖排落款：面板的兄弟节点，否则会被 clip-path 裁掉 -->
<div class="notch-tag" aria-hidden="true">AUTHORIZED TESTING ONLY</div>

<header class="masthead">
  <span class="brand-word">V-SCANNER</span>
  <span class="authorized">仅用于授权测试</span>
</header>

<main class="hero">
  <div class="hero-mark" aria-hidden="true">
    <svg width="36" height="38" viewBox="0 0 36 38" fill="none">
      <path d="M18 1.5 34.5 9.2v12.4L18 36.5 1.5 21.6V9.2Z" stroke="currentColor" stroke-width="1.3"/>
      <path d="M18 9.6 25.8 13.4v7.2L18 24.4l-7.8-3.8v-7.2Z" fill="currentColor" opacity=".2"/>
      <circle cx="18" cy="17" r="2.4" fill="currentColor"/>
    </svg>
  </div>

  <h1 class="display"><span class="display-inner">V-SCANNER</span></h1>

  <p class="lede">移动应用数据安全审计</p>

  <button class="cta" type="button" onclick="enterDashboard()">
    <span>进入工作台</span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M2.5 8h11M9.5 3.5 14 8l-4.5 4.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</main>

<div class="corner-note" aria-hidden="true">2026 · 移动应用审计</div>

<script src="landing.js"></script>
</body>
</html>
