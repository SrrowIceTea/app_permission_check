<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="首页构图：不规则舞台面板 1440x900">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A22"/>
      <stop offset=".45" stop-color="#07131A"/>
      <stop offset="1" stop-color="#04080C"/>
    </linearGradient>
    <radialGradient id="headlight" cx=".78" cy=".52" r=".34">
      <stop offset="0" stop-color="#DCEFF5" stop-opacity=".42"/>
      <stop offset=".35" stop-color="#8FBFD0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#05070A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#17313F" stop-opacity=".38"/>
      <stop offset="1" stop-color="#05070A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF6FA" stop-opacity="0"/>
      <stop offset=".55" stop-color="#EAF6FA" stop-opacity=".65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".95"/>
    </linearGradient>
    <filter id="b18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="b40"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="stage">
      <path d="M44 44 H1396 Q1420 44 1420 68 V300 H1356 V460 H1420 V790 L1340 856 H44 Q20 856 20 832 V68 Q20 44 44 44 Z"/>
    </clipPath>
  </defs>

  <rect width="1440" height="900" fill="#05070A"/>
  <ellipse cx="720" cy="470" rx="760" ry="470" fill="url(#ambient)"/>

  <!-- 舞台面板（不规则：右侧凹槽 + 右下切角） -->
  <g clip-path="url(#stage)">
    <rect x="20" y="44" width="1400" height="812" fill="url(#fog)"/>
    <ellipse cx="1080" cy="430" rx="330" ry="260" fill="url(#headlight)" filter="url(#b40)"/>
    <rect x="900" y="372" width="520" height="2" fill="url(#beam)" filter="url(#b18)" opacity=".85"/>
    <path d="M820 520 Q980 430 1210 440 Q1340 446 1420 500 V856 H780 Z" fill="#04080C" opacity=".55" filter="url(#b40)"/>
    <path d="M900 300 Q1080 240 1260 300 Q1360 336 1420 400 V620 Q1260 560 1080 580 Q940 596 860 540 Z" fill="#0A1B24" opacity=".5" filter="url(#b40)"/>

    <!-- 面板内文案：只留品牌 / 一行说明 / 一个按钮 -->
    <g opacity=".9">
      <path d="M78 150 L96 141 L114 150 L114 169 L96 178 L78 169 Z" fill="none" stroke="#F2F4F6" stroke-width="1.3"/>
      <path d="M96 154 L86 159 L86 168 L96 173 L106 168 L106 159 Z" fill="#F2F4F6" opacity=".22"/>
      <circle cx="96" cy="164" r="2.4" fill="#F2F4F6"/>
    </g>
    <text x="128" y="168" fill="#F2F4F6" font-family="'JetBrains Mono',Consolas,monospace" font-size="10" letter-spacing="2.2">V-SCANNER</text>

    <text x="56" y="360" fill="#F2F4F6" font-family="'Archivo','Helvetica Neue',Arial,sans-serif" font-size="128" font-weight="500" letter-spacing="-5" style="font-stretch:115%">V-SCANNER</text>
    <text x="60" y="412" fill="#A7B0B9" font-family="'Inter','Microsoft YaHei',sans-serif" font-size="15">移动应用数据安全审计</text>

    <rect x="60" y="458" width="196" height="52" fill="#F2F4F6"/>
    <text x="86" y="490" fill="#06080B" font-family="'Inter','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="500" letter-spacing=".8">进入工作台</text>
    <path d="M212 484 h16 m-5 -5 l5 5 -5 5" stroke="#06080B" stroke-width="1.4" fill="none"/>

    <text x="1230" y="86" fill="#8A97A3" font-family="'Inter','Microsoft YaHei',sans-serif" font-size="11">仅用于授权测试</text>
    <line x1="1214" y1="74" x2="1214" y2="92" stroke="#3A4550"/>
  </g>

  <!-- 凹槽里的竖排字（在面板之外，落在页面底色上） -->
  <text x="1392" y="380" transform="rotate(90 1392 380)" text-anchor="middle" fill="#7F8C98" font-family="'JetBrains Mono',Consolas,monospace" font-size="9.5" letter-spacing="3.4">AUTHORIZED TESTING ONLY</text>

  <!-- 面板之外：极小的角标 -->
  <text x="24" y="28" fill="#6F7C88" font-family="'JetBrains Mono',Consolas,monospace" font-size="9" letter-spacing="2">V-SCANNER · MOBILE</text>
  <text x="24" y="884" fill="#5E6A76" font-family="'JetBrains Mono',Consolas,monospace" font-size="9" letter-spacing="1.6">2026 · 移动应用审计</text>

  <!-- 构图标注 -->
  <g fill="#6F7C88" font-family="'JetBrains Mono',Consolas,monospace" font-size="8.5" letter-spacing="1">
    <text x="1250" y="294">NOTCH 64×160</text>
    <text x="60" y="438">ONE LINE ONLY</text>
    <text x="276" y="486">CTA 196×52</text>
  </g>
</svg>
