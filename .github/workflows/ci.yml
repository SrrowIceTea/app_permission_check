# Windows 回归保留 WinPath 覆盖。Gitee 接入见 docs/REGRESSION_CI.md。
name: offline-regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # 与本机一致的强制项：Windows 上不设会出现 GBK 解码崩 Reader 线程（DECISIONS M026）。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # hooks_dispatch / runtime 两组是 node 测试（test_dispatch.mjs / test_runtime.mjs）。
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 构建 Hook 并运行车载与移动回归
        run: python tools/run_regressions.py --prepare --mobile --out output/ci

      - name: 回归判据落盘（失败运行同样保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: output/ci/
          if-no-files-found: warn
