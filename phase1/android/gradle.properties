org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The project path contains non-ASCII characters (the Windows user name is 毛宇淇),
# which AGP refuses by default. This is AGP's own documented opt-out. It is a real
# risk, not a formality - if aapt2 or the NDK misbehave, move the build to an
# ASCII-only path such as D:\vscanner-build instead of fighting this flag.
android.overridePathCheck=true

kotlin.code.style=official

# dl.google.com is unreachable on this network. These timeouts make a blocked
# host fail fast instead of hanging the build for minutes with no output.
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=60000

# Configuration cache is deliberately NOT enabled: KSP + Room in this setup is
# not yet proven under it, and a cache miss would mask real failures.
