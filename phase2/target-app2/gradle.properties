# Phase 2 靶子 App —— 仅用于授权测试（自有设备与自有 APK）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=D:/Anroid/temp
org.gradle.parallel=true
org.gradle.caching=true

# 本机 JDK 21（勿用 Android Studio 的 JBR/JDK25，Gradle 8.13 不支持 Java 25）。
# 写入配置文件以便任何 shell 下都使用正确 JDK。
# 2026-09-28：旧值指向旧开发机的 E:\vs_all\全局\...\.tools\jdk21，该目录在本机不存在，
# Gradle 会以 "Java home supplied is invalid" 直接失败。改为本机 JDK 21。
org.gradle.java.home=D:/Anroid/JDK

android.useAndroidX=true
android.nonTransitiveRClass=true

# 项目路径含非 ASCII 字符（Windows 用户名 毛宇淇），AGP 默认拒绝。
# 这是 AGP 官方提供的豁免开关；若 aapt2 出问题，应把工程挪到纯 ASCII 路径重建。
android.overridePathCheck=true

kotlin.code.style=official

# dl.google.com 网络被阻断；这些超时让被阻断的主机快速失败，而不是挂起数分钟。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=60000
